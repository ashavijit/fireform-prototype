[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fireform"
version = "0.1.0"
description = "Report once, file everywhere — AI-powered incident report automation for first responders"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Avijit Sen", email = "avijitsen24.me@gmail.com" }]
keywords = ["fireform", "incident-report", "llm", "pdf", "first-responders", "gsoc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "click>=8.1",
    "PyMuPDF>=1.24",
    "PyYAML>=6.0",
    "openai-whisper>=20231117",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
fireform = "fireform.cli:cli"

[project.urls]
Homepage   = "https://github.com/juanalvv/FireForm"
Repository = "https://github.com/ashavijit/fireform-prototype"

[tool.setuptools.packages.find]
where = ["src"]

# ── Ruff linting ──────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths   = ["tests"]
asyncio_mode = "auto"
addopts     = "-v --tb=short"

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/fireform"]
omit   = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under   = 80

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict         = true
ignore_missing_imports = true

# ── FireForm config ───────────────────────────────────────────────────────────
[tool.fireform]
default_model     = "llama3"
ollama_url        = "http://localhost:11434"
default_templates = ["nfirs_basic"]
output_dir        = "./output"
whisper_model     = "base"
